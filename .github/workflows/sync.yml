name: Firemail AI Inbox Sync

on:
  schedule:
    # Triggers every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

concurrency:
  group: firemail-sync
  cancel-in-progress: true

jobs:
  sync-inbox-continuous:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Continuous 30-Second Sync Loop
        run: |
          echo "🚀 Starting 30-second sync loop..."
          END_TIME=$((SECONDS + 285))
          while [ $SECONDS -lt $END_TIME ]; do
            echo "========================================"
            echo "📬 Syncing inboxes at $(date)..."
            node scripts/sync-inbox.mjs || true
            echo "⏳ Sleeping 30 seconds until next sync..."
            sleep 30
          done
          echo "✅ 5-minute block completed. Next scheduled runner will continue seamlessly."
